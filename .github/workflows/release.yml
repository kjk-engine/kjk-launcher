# A version tag (v0.2.0) builds the launcher for Windows, macOS and Linux,
# attests the packages (build provenance) and drafts a Release with them
# and SHA256SUMS. The self-update finds its package by the name's ending.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: windows-x86_64.zip
          - runner: macos-15
            suffix: macos-aarch64.tar.gz
          - runner: ubuntu-22.04
            suffix: linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Toolchain
        run: rustup show
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          name="kjk-launcher-$TAG"
          stage="packages/$name"
          mkdir -p "$stage"
          cp README.md "$stage/README.txt"
          cp LICENSE "$stage/LICENSE.txt"
          cp assets/fonts/OFL-Jost.txt assets/fonts/OFL-Geist.txt "$stage/"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/kjk-launcher.exe target/release/kjk-launcher-cli.exe "$stage/"
              (cd packages && 7z a "$name-$SUFFIX" "$name" > /dev/null) ;;
            macOS)
              app="$stage/kjk launcher.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp target/release/kjk-launcher "$app/Contents/MacOS/"
              sed "s/VERSION/${TAG#v}/g" assets/Info.plist > "$app/Contents/Info.plist"
              plutil -lint "$app/Contents/Info.plist"
              iconset=$(mktemp -d)/kjk-launcher.iconset
              mkdir -p "$iconset"
              for size in 16 32 128 256 512; do
                sips -z $size $size assets/kjk-launcher-1024.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
                sips -z $((size * 2)) $((size * 2)) assets/kjk-launcher-1024.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
              done
              iconutil -c icns -o "$app/Contents/Resources/kjk-launcher.icns" "$iconset"
              # An ad-hoc signature over the whole bundle, as kjk's app has:
              # a downloaded app with a broken signature cannot be opened.
              codesign --force --sign - "$app"
              codesign --verify --strict -vv "$app"
              cp target/release/kjk-launcher-cli "$stage/"
              tar -czf "packages/$name-$SUFFIX" -C packages "$name" ;;
            *)
              cp target/release/kjk-launcher target/release/kjk-launcher-cli "$stage/"
              tar -czf "packages/$name-$SUFFIX" -C packages "$name" ;;
          esac
          ls -la packages
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/*${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.suffix }}
          path: packages/*${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        working-directory: packages
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft $prerelease \
            --title "kjk launcher ${TAG#v}" \
            --notes "Unsigned builds for Windows, macOS and Linux. SHA256SUMS lists the checksum of each file. Version 0.1.0 cannot update itself. Replace it with 0.2.0 by hand once."
